# ============================================================
# GitLab CI/CD Pipeline — EDI QA Framework
# ============================================================
# This pipeline validates a Maven multi-module project composed of:
#   - api-framework  : REST API smoke tests (REST Assured + TestNG + Extent Reports)
#   - edi-module     : X12 EDI parsing, H2 DB ingestion, and data-verification tests
#
# Stages:
#   1. build  — Compiles the entire multi-module project
#   2. test   — Runs all TestNG suites and publishes results
#
# Test results are exposed in two ways:
#   - JUnit XML (artifacts:reports:junit) — shows pass/fail natively in
#     GitLab merge request and pipeline views
#   - Extent HTML report — downloadable from the job artifact browser
#
# Pipeline triggers on pushes to `main` and on merge requests.
# ============================================================

default:
  image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - test

# ── Cache ─────────────────────────────────────────────────
# Cache the local Maven repository across jobs and pipelines.
# Maven's local repo is redirected inside the project directory
# (via MAVEN_OPTS) because GitLab CI cache only reliably persists
# paths under $CI_PROJECT_DIR, not absolute home-directory paths.
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.maven_cache: &maven_cache
  cache:
    key:
      files:
        - pom.xml
        - api-framework/pom.xml
        - edi-module/pom.xml
    paths:
      - .m2/repository
    policy: pull-push

# ── Trigger rules ─────────────────────────────────────────
.default_rules: &default_rules
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Jobs ──────────────────────────────────────────────────

compile:
  stage: build
  <<: [*maven_cache, *default_rules]
  script:
    - mvn clean compile --batch-mode --no-transfer-progress

test:
  stage: test
  <<: [*maven_cache, *default_rules]
  script:
    - mvn test --batch-mode --no-transfer-progress
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/target/surefire-reports/*.xml"
    paths:
      - api-framework/target/extent-reports/
      - "**/target/surefire-reports/*.xml"